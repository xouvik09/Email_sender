[project]
name = "email-sender"
version = "1.0.0"
description = "Send templated plaintext/HTML emails over SMTP to one or many recipients."
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0.0"]

[project.scripts]
email-sender = "email_sender.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["email_sender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
